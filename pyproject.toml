[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shotwise"
version = "0.1.0"
description = "Task-aware measurement allocation for noisy kernel estimation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Artur Miroszewski", email = "artur.miroszewski@esa.int" }
]
keywords = [
  "quantum machine learning",
  "kernel methods",
  "svm",
  "adaptive sampling",
  "shot allocation",
  "quantum kernels"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.15",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.0",
  "pre-commit>=3.7"
]
qiskit = [
  "qiskit>=1.0",
  "qiskit-ibm-runtime>=0.30",
  "qiskit-machine-learning>=0.7"
]
pennylane = [
  "pennylane>=0.45",
  "pennylane-qiskit>=0.45"
]
examples = [
  "pandas>=2.2",
  "matplotlib>=3.8",
  "seaborn>=0.13"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true